[package]
name = "noctua"
version = "0.1.0"
edition = "2024"
description = "A modular Rust desktop PDF reader with dark mode and translation support."
license = "GPL-3.0-only"
repository = "https://github.com/OreenXP/Noctua-"

[dependencies]
tauri = "2"
rfd = "0.15"
open = "5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
dirs = "5.0"

[build-dependencies]
tauri-build = "2"

[package]
name = "noctua"
version = "0.1.0"
edition = "2024"
description = "A modular Rust desktop PDF reader with dark mode and translation support."
license = "GPL-3.0-only"
repository = "https://github.com/OreenXP/Noctua-"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "e231594b6b8818ea8d668ee2eb73e1fb09300654" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "e231594b6b8818ea8d668ee2eb73e1fb09300654", features = ["font-kit", "wayland", "x11"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
dirs = "5.0"

[profile.release]
lto = "thin"

<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noctua</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="app" class="app-shell" aria-live="polite">
      <div id="context-menu" class="context-menu hidden" role="menu">
        <button id="context-open" role="menuitem">Abrir</button>
        <button id="context-folder" role="menuitem">Mostrar en carpeta</button>
      </div>
      <section id="welcome" class="welcome hidden">
        <img class="welcome-icon" src="./assets/icons/moon.svg" alt="" />
        <h1>Elige tu biblioteca</h1>
        <p>Selecciona una carpeta donde guardas tus libros PDF.</p>
        <button id="welcome-choose" class="button button-primary">Elegir carpeta</button>
      </section>

      <section id="library" class="library hidden">
        <header class="topbar">
          <div class="brand">
            <div class="brand-mark"><img src="./assets/icons/moon.svg" alt="" /></div>
            <div class="brand-copy">
              <strong>Noctua</strong>
              <span>Tu biblioteca de libros</span>
            </div>
          </div>
          <label class="search-box">
            <img src="./assets/icons/search.svg" alt="" />
            <input id="search" type="search" placeholder="Buscar libros..." autocomplete="off" />
            <span>Ctrl K</span>
          </label>
          <div class="top-actions">
            <button id="change-folder" class="button button-secondary"><img src="./assets/icons/folder.svg" alt="" />Cambiar carpeta</button>
            <button id="open-pdf" class="button button-primary"><img src="./assets/icons/external-link.svg" alt="" />Abrir PDF</button>
            <button class="icon-button" title="Preferencias" aria-label="Preferencias"><img src="./assets/icons/settings.svg" alt="" /></button>
          </div>
        </header>

        <div class="library-toolbar">
          <div class="library-title"><h2>Mi biblioteca</h2><span id="book-count">0 libros</span></div>
          <div class="view-tools">
            <label class="sort-select"><img src="./assets/icons/sort.svg" alt="" /><select id="sort"><option value="recent">Recientes</option><option value="name">Nombre</option><option value="size">Tamaño</option></select><img class="chevron" src="./assets/icons/chevron-down.svg" alt="" /></label>
            <div class="view-toggle" role="group" aria-label="Vista">
              <button id="list-view" class="view-button active" title="Vista lista"><img src="./assets/icons/list.svg" alt="" /></button>
              <button id="grid-view" class="view-button" title="Vista cuadrícula"><img src="./assets/icons/grid.svg" alt="" /></button>
            </div>
            <button id="refresh" class="icon-button" title="Actualizar" aria-label="Actualizar"><img src="./assets/icons/refresh.svg" alt="" /></button>
          </div>
        </div>

        <div class="content">
          <div id="list-content" class="book-list">
            <div class="list-header"><span>NOMBRE</span><span>TAMAÑO</span><span>MODIFICADO</span><span></span></div>
            <div id="books-list"></div>
          </div>
          <div id="grid-content" class="book-grid hidden"></div>
          <div id="empty" class="empty hidden"><img src="./assets/icons/file-text.svg" alt="" /><h3>No hay libros todavía</h3><p>Agrega archivos PDF a tu vault para verlos aquí.</p></div>
        </div>

        <footer class="statusbar"><div class="vault-label"><img src="./assets/icons/folder.svg" alt="" /><span id="vault-path"></span></div><span id="status">Listo</span></footer>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
